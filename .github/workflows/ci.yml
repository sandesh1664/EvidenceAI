name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-tool"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks-tool/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/gitleaks-tool/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks-tool/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks-tool" gitleaks
          echo "$RUNNER_TEMP/gitleaks-tool" >> "$GITHUB_PATH"
      - name: Synthetic credential and policy regressions
        run: python3 -m unittest discover -s infra/security/tests -v
      - name: Full history, working source and nested archive secret gate
        run: python3 infra/security/scan_secrets.py --private-directory "$RUNNER_TEMP/unsuppressed-secret-evidence"
  application:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        env:
          POSTGRES_DB: evidenceai_test_00000000000000000000000000000000
          POSTGRES_USER: evidenceai
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U evidenceai -d evidenceai_test_00000000000000000000000000000000" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://evidenceai:synthetic-ci-only-password@127.0.0.1:5432/evidenceai_test_00000000000000000000000000000000
      EVIDENCEAI_TEST_DATABASE_URL: postgresql+psycopg://evidenceai:synthetic-ci-only-password@127.0.0.1:5432/evidenceai_test_00000000000000000000000000000000
      APP_ENV: test
      EMBEDDING_PROVIDER: disabled
      LLM_PROVIDER: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: 3.14.6}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 26.12.0, package-manager-cache: false}
      - name: Backend and PostgreSQL integration
        working-directory: apps/api
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
          python -m pip check
          python -m pytest -q
          python -m app.evaluate --repeat 3
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build
      - name: Browser integration
        working-directory: apps/web
        run: |
          python -m venv ../api/.venv --system-site-packages
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
  containers:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Workflow syntax and shell checks
        run: docker run --rm --network none -v "$PWD/.github/workflows:/workflows:ro" rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 /workflows/ci.yml /workflows/deploy.yml
      - name: Build immutable release candidates
        run: |
          docker build -t evidenceai-api:m121 -t "evidenceai-api:sha-${GITHUB_SHA}" apps/api
          docker build -t evidenceai-web:m121 -t "evidenceai-web:sha-${GITHUB_SHA}" apps/web
          docker build -t evidenceai-backup:m121 -t "evidenceai-backup:sha-${GITHUB_SHA}" infra/backup
          docker build -t evidenceai-proxy:m121 -t "evidenceai-proxy:sha-${GITHUB_SHA}" infra/deploy
          docker build -t evidenceai-database:m121 -t "evidenceai-database:sha-${GITHUB_SHA}" infra/database
          docker build -t evidenceai-prometheus:m121 -t "evidenceai-prometheus:sha-${GITHUB_SHA}" infra/monitoring/build-prometheus
          docker build -t evidenceai-exporter:m121 -t "evidenceai-exporter:sha-${GITHUB_SHA}" infra/monitoring/build-exporter
      - name: Local HTTPS, secrets, storage, monitoring and recovery drill
        run: |
          python3 -m venv /tmp/evidenceai-m12-load
          /tmp/evidenceai-m12-load/bin/pip install -r infra/load/requirements.txt
          EVIDENCEAI_ACCEPTANCE=1 python3 infra/scripts/smoke.py
      - name: Package images without publishing
        run: |
          mkdir -p release
          docker save "evidenceai-api:sha-${GITHUB_SHA}" -o release/api.tar
          docker save "evidenceai-web:sha-${GITHUB_SHA}" -o release/web.tar
          docker save "evidenceai-backup:sha-${GITHUB_SHA}" -o release/backup.tar
          docker save "evidenceai-proxy:sha-${GITHUB_SHA}" -o release/proxy.tar
          docker save "evidenceai-database:sha-${GITHUB_SHA}" -o release/database.tar
          docker save "evidenceai-prometheus:sha-${GITHUB_SHA}" -o release/prometheus.tar
          docker save "evidenceai-exporter:sha-${GITHUB_SHA}" -o release/exporter.tar
          cp /tmp/evidenceai-m121-smoke-result.json release/staging-result.json
          git archive --format=tar.gz --output=release/deployment-source.tar.gz HEAD
          python3 infra/scripts/release_manifest.py --output release/manifest.json
      - name: Scan candidate images (no Docker socket in scanner)
        run: |
          for image in api web backup proxy; do
            docker run --rm -v "$PWD/release:/scan" aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --input "/scan/$image.tar" --scanners vuln,secret --format json --output "/scan/$image-scan.json" --severity HIGH,CRITICAL --exit-code 1 || touch release/scan-failed
          done
          test ! -f release/scan-failed
      - name: Gate pinned database and monitoring runtime images
        if: ${{ !cancelled() }}
        run: python3 infra/scripts/scan_images.py --support-only --directory release/support
  dependency-report:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: 3.14.6}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: 26.12.0, package-manager-cache: false}
      - name: Dependency vulnerability reports
        run: |
          mkdir -p reports
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict -r apps/api/requirements.txt --format json --output reports/python-audit.json || touch reports/runtime-audit-failed
          cd apps/web
          npm ci
          npm audit --json > ../../reports/npm-all.json || true
          npm audit --omit=dev --audit-level=high --json > ../../reports/npm-runtime.json || touch ../../reports/runtime-audit-failed
          cd ../..
          test ! -f reports/runtime-audit-failed
  safe-summary:
    needs: [secrets, application, containers, dependency-report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Generate fixed-schema non-sensitive conclusions
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 infra/security/ci_summary.py
      - name: Upload only the fixed-schema status file
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-status-${{ github.sha }}
          path: safe-ci-summary/status.json
          if-no-files-found: error
          retention-days: 7
