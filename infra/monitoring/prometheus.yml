global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: evidenceai-api
    metrics_path: /api/v1/ops/metrics
    scrape_timeout: 20s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/operations_token
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: evidenceai-worker
    static_configs:
      - targets: [host.docker.internal:9100]
